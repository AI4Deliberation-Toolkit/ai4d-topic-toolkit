[supervisord]
nodaemon=true
user=root
pidfile=/tmp/supervisord.pid

[program:postgres]
command=gosu postgres postgres -D %(ENV_PGDATA)s
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:app]
command=/usr/src/app/docker/pod/app-start.sh
directory=/usr/src/app
autostart=true
autorestart=true
startretries=10
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
