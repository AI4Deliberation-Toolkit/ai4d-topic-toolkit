stages:
  - validate
  # - release    # TODO: enable when deploy target is decided
  # - deploy     # TODO: enable when deploy target is decided

validate-toolkit:
  stage: validate
  image: python:3.12-slim
  services:
    - name: postgres:17.6
      alias: db
  variables:
    POSTGRES_DB: postgres
    POSTGRES_USER: ci
    POSTGRES_PASSWORD: ci
    POSTGRES_HOST: db
    POSTGRES_PORT: '5432'
    SECRET_KEY: ci-only-not-secret-do-not-use-in-prod
    DJANGO_SETTINGS_MODULE: ai4d_topic_toolkit.settings.staging
  before_script:
    - pip install --no-cache-dir --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
  script:
    - python manage.py migrate --noinput
    - python manage.py seed_taxonomy
    - python manage.py validate_taxonomy

bump-guard:
  stage: validate
  image: alpine:latest
  variables:
    GIT_DEPTH: 0
  before_script:
    - apk add --no-cache git
    - git fetch origin main:refs/remotes/origin/main
  script:
    - |
      if git diff --name-only origin/main HEAD | grep -q '^topic_extraction/taxonomy_data\.py$'; then
        OLD=$(git show origin/main:topic_extraction/taxonomy_data.py | grep '^TAXONOMY_VERSION' | head -1)
        NEW=$(grep '^TAXONOMY_VERSION' topic_extraction/taxonomy_data.py | head -1)
        if [ "$OLD" = "$NEW" ]; then
          echo "ERROR: topic_extraction/taxonomy_data.py changed but TAXONOMY_VERSION did not bump."
          echo "Old: $OLD"
          echo "New: $NEW"
          exit 1
        fi
        echo "OK: TAXONOMY_VERSION bumped from '$OLD' to '$NEW'."
      else
        echo "taxonomy_data.py unchanged in this MR — bump check skipped."
      fi
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
